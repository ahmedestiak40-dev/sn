 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 Snake Deluxe</title>
<style>
  * {
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top left, #01030a, #030712, #000);
    overflow: hidden;
    color: #0ff;
  }

  h1 {
    text-align: center;
    font-size: 2em;
    color: #00ffff;
    text-shadow: 0 0 20px #00ffff, 0 0 40px #0077ff;
    margin-bottom: 10px;
  }

  #game-board {
    width: 360px;
    height: 360px;
    display: grid;
    grid-template-columns: repeat(18, 1fr);
    grid-template-rows: repeat(18, 1fr);
    background: linear-gradient(135deg, #051020, #0a1a33);
    border: 2px solid #00ffff;
    border-radius: 15px;
    box-shadow: 0 0 30px #00ffff66;
    position: relative;
  }

  .snake {
    background: linear-gradient(90deg, #00ffff, #0077ff);
    border-radius: 6px;
    box-shadow: 0 0 15px #00ffff;
  }

  .snake.head {
    background: linear-gradient(90deg, #00ffcc, #66ff99);
    box-shadow: 0 0 25px #00ffcc;
  }

  .food {
    background: radial-gradient(circle, #ff00ff, #ff0066);
    border-radius: 50%;
    box-shadow: 0 0 25px #ff00ff;
  }

  #hud {
    text-align: center;
    margin: 10px 0;
  }

  #score, #highscore {
    font-size: 1.1em;
    margin: 5px;
    color: #fff;
  }

  #restart {
    background: linear-gradient(90deg, #00ffff, #0077ff);
    border: none;
    color: #000;
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 0 15px #00ffff;
    transition: all 0.2s;
  }

  #restart:hover {
    transform: scale(1.1);
    box-shadow: 0 0 30px #00ffff;
  }

  /* Mobile touch controls */
  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 15px;
  }

  .arrow-row {
    display: flex;
  }

  .btn {
    width: 60px;
    height: 60px;
    background: linear-gradient(90deg, #0077ff, #00ffff);
    border: none;
    border-radius: 50%;
    margin: 5px;
    color: #000;
    font-size: 1.5em;
    font-weight: bold;
    box-shadow: 0 0 15px #00ffff;
    cursor: pointer;
    transition: 0.3s;
  }

  .btn:active {
    transform: scale(0.9);
  }

  @media (max-width: 500px) {
    #game-board { width: 300px; height: 300px; }
    .btn { width: 50px; height: 50px; }
  }

  /* Neon pulse animation */
  @keyframes glowPulse {
    0% { box-shadow: 0 0 10px #00ffff; }
    50% { box-shadow: 0 0 30px #00ffff; }
    100% { box-shadow: 0 0 10px #00ffff; }
  }

  #game-board.active {
    animation: glowPulse 2s infinite;
  }
</style>
</head>
<body>
  <h1>🐍 Neon Snake Deluxe</h1>
  <div id="hud">
    <div id="score">Score: 0</div>
    <div id="highscore">High Score: 0</div>
  </div>
  <div id="game-board"></div>
  <button id="restart">Restart</button>

  <div class="controls">
    <div class="arrow-row">
      <button class="btn" id="up">⬆️</button>
    </div>
    <div class="arrow-row">
      <button class="btn" id="left">⬅️</button>
      <button class="btn" id="down">⬇️</button>
      <button class="btn" id="right">➡️</button>
    </div>
  </div>

<script>
const board = document.getElementById("game-board");
const scoreDisplay = document.getElementById("score");
const highScoreDisplay = document.getElementById("highscore");
const restartBtn = document.getElementById("restart");

let snake = [{ x: 9, y: 9 }];
let direction = { x: 0, y: 0 };
let nextDir = { x: 0, y: 0 };
let food = randomFood();
let score = 0;
let highScore = localStorage.getItem("snakeHighScore") || 0;
let speed = 130;
let interval;

// Sound effects
const eatSound = new Audio("https://cdn.pixabay.com/audio/2022/03/15/audio_7a6efbaf58.mp3");
const gameOverSound = new Audio("https://cdn.pixabay.com/audio/2022/03/15/audio_d80a4dba07.mp3");

function randomFood() {
  return {
    x: Math.floor(Math.random() * 18) + 1,
    y: Math.floor(Math.random() * 18) + 1
  };
}

function draw() {
  board.innerHTML = "";
  snake.forEach((seg, index) => {
    const el = document.createElement("div");
    el.style.gridRowStart = seg.y;
    el.style.gridColumnStart = seg.x;
    el.classList.add("snake");
    if (index === 0) el.classList.add("head");
    board.appendChild(el);
  });
  const foodEl = document.createElement("div");
  foodEl.style.gridRowStart = food.y;
  foodEl.style.gridColumnStart = food.x;
  foodEl.classList.add("food");
  board.appendChild(foodEl);
}

function update() {
  direction = nextDir;
  if (direction.x === 0 && direction.y === 0) return;

  const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

  // Collision
  if (
    head.x < 1 || head.x > 18 ||
    head.y < 1 || head.y > 18 ||
    snake.some(seg => seg.x === head.x && seg.y === head.y)
  ) {
    clearInterval(interval);
    board.classList.remove("active");
    gameOverSound.play();
    alert("💀 Game Over! Your score: " + score);
    if (score > highScore) {
      highScore = score;
      localStorage.setItem("snakeHighScore", highScore);
    }
    reset();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    eatSound.play();
    score++;
    scoreDisplay.textContent = "Score: " + score;
    if (score > highScore) {
      highScoreDisplay.textContent = "High Score: " + score;
      localStorage.setItem("snakeHighScore", score);
    }
    food = randomFood();
    if (speed > 70) {
      speed -= 5;
      clearInterval(interval);
      interval = setInterval(gameTick, speed);
    }
  } else {
    snake.pop();
  }
  draw();
}

function gameTick() { update(); }

function reset() {
  snake = [{ x: 9, y: 9 }];
  direction = { x: 0, y: 0 };
  nextDir = { x: 0, y: 0 };
  score = 0;
  speed = 130;
  food = randomFood();
  scoreDisplay.textContent = "Score: 0";
  highScoreDisplay.textContent = "High Score: " + highScore;
  board.classList.remove("active");
  draw();
}

function start() {
  if (interval) clearInterval(interval);
  interval = setInterval(gameTick, speed);
  board.classList.add("active");
}

document.addEventListener("keydown", e => {
  if (e.key === "ArrowUp" && direction.y === 0) nextDir = { x: 0, y: -1 };
  if (e.key === "ArrowDown" && direction.y === 0) nextDir = { x: 0, y: 1 };
  if (e.key === "ArrowLeft" && direction.x === 0) nextDir = { x: -1, y: 0 };
  if (e.key === "ArrowRight" && direction.x === 0) nextDir = { x: 1, y: 0 };
  start();
});

document.getElementById("up").onclick = () => { if (direction.y === 0) nextDir = { x: 0, y: -1 }; start(); };
document.getElementById("down").onclick = () => { if (direction.y === 0) nextDir = { x: 0, y: 1 }; start(); };
document.getElementById("left").onclick = () => { if (direction.x === 0) nextDir = { x: -1, y: 0 }; start(); };
document.getElementById("right").onclick = () => { if (direction.x === 0) nextDir = { x: 1, y: 0 }; start(); };

restartBtn.onclick = () => reset();

// Init
reset();
</script>
</body>
</html>
